spring:
  application:
    name: realityai-core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/realityai
    username: ${DB_USERNAME:realityai}
    password: ${DB_PASSWORD:realityai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: 8080

grpc:
  server:
    port: 9090
