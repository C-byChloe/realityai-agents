[project]
name = "realityai-agent-core"
version = "0.1.0"
description = "Multi-agent AI course management assistant - Agent Core"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langsmith>=0.2.0",
    "chromadb>=0.5.0",
    "redis>=5.0.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
# Explicit package list — setuptools auto-discovery refuses to build when it
# sees more than a handful of top-level packages, which it does here.
packages = [
    "agents",
    "caching",
    "evaluation",
    "grpc_client",
    "observability",
    "proto_gen",
    "reasoning",
    "retrieval",
    "safety",
    "schemas",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
